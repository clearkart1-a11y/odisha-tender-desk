name: Refresh tenders and deploy site

on:
  schedule:
    - cron: "40 0 * * *"     # 06:10 IST daily
    - cron: "40 12 * * *"    # 18:10 IST daily
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

env:
  SITE_URL: https://clearkart1-a11y.github.io/odisha-tender-desk
  BASE: /odisha-tender-desk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Collect open tenders from tendersodisha.gov.in
        if: github.event_name != 'push'
        id: collect
        continue-on-error: true      # if the portal is down or blocks the runner, still deploy the last good data
        run: python tools/collect_open.py

      - name: Save new data to the repo
        if: steps.collect.outcome == 'success'
        run: |
          git config user.name "tender-bot"
          git config user.email "tender-bot@users.noreply.github.com"
          git add data/active.json.gz
          git diff --cached --quiet || (git commit -m "Data: open tenders $(date -u +%F)" && git push)

      - name: Build site
        run: python tools/site_gen.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
